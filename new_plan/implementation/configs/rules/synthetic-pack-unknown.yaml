# AFTERLAP synthetic rule pack with an unresolved critical condition
#
# SYNTHETIC AND UNREVIEWED. This pack deliberately cannot resolve the sporting
# condition that gates overtake permission. It exists to prove that an
# unresolved applicable condition suppresses advice: the resolved context has a
# non-empty unknown_conditions and an EMPTY admissible_profiles tuple, and the
# independent checker returns unknown with margin=None rather than a permissive
# default.

id: synthetic-pack-unknown
synthetic: true
reviewed: false
description: >-
  Illustrative synthetic pack whose critical eligibility condition is
  unresolved. Used to test that unknown suppresses advice.
season_revision: synthetic-2026-r0-unknown

season:
  id: synthetic-season-2026-r0-unknown

  statements:
    absolute_power_ceiling_w:
      value: 350000.0
      unit: W
      measurement_bus: ers_k_dc
      representation: "deployment_power_w(ers_k_dc) <= 350000"
      article: C5.2.7
      source_id: R02
      source_url: https://www.fia.com/regulation/category/2182
      published_date: "2026-08-05"
      effective_date: "2026-08-05"
      reviewer: null

    battery_energy_min_j:
      value: 0.0
      unit: J
      measurement_bus: battery
      representation: "battery_energy_j >= 0"
      article: C5.2.9
      source_id: R02
      reviewer: null

    battery_energy_max_j:
      value: 4000000.0
      unit: J
      measurement_bus: battery
      representation: "battery_energy_j <= 4000000"
      article: C5.2.9
      source_id: R02
      reviewer: null

    recharge_allowance_per_lap_j:
      value: 8500000.0
      unit: J
      measurement_bus: cu_k_dc
      representation: "cumulative_charge_bus_energy_j(this_lap) <= 8500000"
      article: C5.2.10
      source_id: R02
      reviewer: null

    recharge_measurement_bus:
      text_value: cu_k_dc
      representation: "recharge ledger is accumulated at the CU-K DC bus"
      article: C5.2.10
      source_id: R02
      reviewer: null

    max_power_ramp_w_per_s:
      value: 700000.0
      unit: W/s
      measurement_bus: ers_k_dc
      representation: "abs(d(deployment_power_w)/dt) <= 700000"
      article: C5.12
      source_id: R02
      reviewer: null

  power_curves:
    - curve_id: baseline-speed-curve
      measurement_bus: ers_k_dc
      points:
        - {speed_mps: 0.0, max_power_w: 350000.0}
        - {speed_mps: 80.0, max_power_w: 350000.0}
        - {speed_mps: 95.0, max_power_w: 150000.0}
        - {speed_mps: 110.0, max_power_w: 0.0}
      statement:
        representation: "piecewise-linear ceiling in speed, identical to synthetic-pack-v1"
        article: C5.2.8
        source_id: R02
        reviewer: null
        unit: W
        measurement_bus: ers_k_dc

  detection_lines:
    - line_id: detect-1
      kind: detection
      s_m: 1600.0
      statement:
        representation: "eligibility observed when the car crosses s_m = 1600"
        article: B7.2
        source_id: R03
        reviewer: null
        unit: m
    - line_id: activate-1
      kind: activation
      s_m: 1900.0
      statement:
        representation: "permission activates when the car crosses s_m = 1900"
        article: B7.2
        source_id: R03
        reviewer: null
        unit: m
    - line_id: attack-exit
      kind: checkpoint
      s_m: 2100.0
      statement:
        representation: "attack outcome checkpoint at s_m = 2100"
        article: B7.2
        source_id: R03
        reviewer: null
        unit: m

  coverage:
    - concern: Electrical DC ceiling
      status: implemented_and_tested
      reference_keys: [absolute_power_ceiling_w]
      test_ids:
        - test_unknown.py::test_unknown_pack_still_reports_numeric_power_margins
    - concern: Speed/context curves
      status: implemented_and_tested
      test_ids:
        - test_unknown.py::test_unknown_pack_still_reports_numeric_power_margins
    - concern: Charge range
      status: implemented_and_tested
      reference_keys: [battery_energy_min_j, battery_energy_max_j]
      test_ids:
        - test_unknown.py::test_unknown_pack_still_reports_numeric_power_margins
    - concern: Recharge allowance
      status: implemented_and_tested
      reference_keys: [recharge_allowance_per_lap_j, recharge_measurement_bus]
      test_ids:
        - test_unknown.py::test_unknown_pack_still_reports_numeric_power_margins
    - concern: Power demand transitions
      status: implemented_and_tested
      reference_keys: [max_power_ramp_w_per_s]
      test_ids:
        - test_unknown.py::test_unknown_pack_still_reports_numeric_power_margins
    - concern: Overtake permission
      status: unsupported
      note: >-
        The sporting condition that gates the permission is referenced by an
        event document this pack could not resolve. No permission may be
        inferred from this pack, and no default is invented.
    - concern: Flags and conditions
      status: review_required
      note: This pack declares no race-control states.
    - concern: Driver information path
      status: not_applicable
      note: Owned by the API and simulation modules.
    - concern: Unknown referenced documents
      status: implemented_and_tested
      test_ids:
        - test_unknown.py::test_unknown_pack_yields_no_admissible_profiles
        - test_unknown.py::test_unknown_check_has_no_margin
        - test_unknown.py::test_aggregate_is_unknown_when_any_check_is_unknown
        - test_unknown.py::test_unknown_pack_admits_no_overtake_plan
    - concern: Thermal and torque derating
      status: unsupported
      note: This pack declares no derate model, so no derating is applied or claimed.
    - concern: Event-specific curves, allowances and line locations
      status: unsupported
      note: No event level is present.
    - concern: Execution lead time
      status: implemented_and_tested
      test_ids:
        - test_checker.py::test_insufficient_execution_lead_time_fails
      note: Operational constraint of this product, not an FIA article.

  unknown_conditions:
    - condition: overtake_gap_threshold_from_unresolved_event_document
      critical: true
      scope: overtake_permission
      note: >-
        The gap threshold that decides eligibility at the detection line is
        specified in an event supporting document that was not resolved. Without
        it no permission can be asserted, so every resolution from this pack is
        unknown and offers no admissible profile.
    - condition: event_supporting_document_referenced_but_not_resolved
      critical: false
      scope: advisory
      note: >-
        Recorded so that a passing check is never read as evidence that every
        applicable condition was resolved.
