# Factor registry — coordinator-owned.
#
# Required by 17_real_tracks_conditions/FACTOR_AND_INFLUENCE.md, which opens by
# rejecting the idea that "every factor has a weight". Three different things
# get confused under that phrase, so this document keeps them in three separate
# sections and never mixes them:
#
#   physics_parameters  units, and they change state transitions. Calibrate
#                       them; reinforcement learning must never reinterpret
#                       their units.
#   reward_coefficients declared product priorities. Humans set and freeze them
#                       before final evaluation. Dimensionless.
#   policy_features     what the actor observes. Influence here EMERGES from a
#                       learned nonlinear function; there is no stable, single,
#                       meaningful weight per input, so this section records no
#                       importance number at all. Influence is measured by the
#                       interventions named at the bottom of this file, or it is
#                       not reported.
#
# Being listed here is not a claim of calibration. Every `verification` value of
# `synthetic_assumption` means exactly that: an engineering assumption with a
# stated source and no measurement behind it. `availability: unavailable` means
# the product refuses to supply the factor rather than substituting a number.

id: factor-registry-v1
schema_version: "1"
synthetic: true
description: >-
  Registry of the factors the simulator, controller and actor actually use as of
  the A16 real-circuit work. Entries describe what exists in code, including the
  ones that are unavailable and why.

# --------------------------------------------------------------------------- #
# 1. Physics parameters: units, and they move the state
# --------------------------------------------------------------------------- #

physics_parameters:

  - id: track.curvature
    meaning: Horizontal curvature of the compiled centreline at a lap position.
    units: 1/m
    simulator_role: >-
      Sets the lateral acceleration demand at a given speed and therefore the
      speed envelope through the tyre friction ellipse.
    source: >-
      Compiled track package, periodic cubic B-spline over OpenF1 location
      telemetry; smoothing chosen against held-out point residual.
    observation_source: eight fixed-distance lookahead points in the actor features
    missing_behaviour: >-
      A track without a validated package cannot be loaded at all, so this factor
      is never absent at run time.
    supported_range: [-0.167, 0.167]
    distribution_family: empirical per circuit
    correlation_group: geometry
    causal_parents: []
    verification: measured_on_driven_line
    validation_owner: tracks/validate.py check `curvature_bounded`
    availability: available
    caveat: >-
      A driven racing line, not a surveyed centreline. Its curvature is what a
      car did, which is tighter at apexes than the circuit's own geometry.

  - id: track.grade
    meaning: Longitudinal gradient dz/ds along the centreline.
    units: rad
    simulator_role: Gravitational force component along the direction of travel.
    source: Compiled track package elevation channel.
    observation_source: lookahead grade at the eight distance points
    missing_behaviour: >-
      Declared unavailable for the whole circuit when the elevation channel
      cannot produce a plausible profile; the package is then refused rather
      than shipped with a fabricated grade.
    supported_range: [-0.25, 0.25]
    distribution_family: empirical per circuit
    correlation_group: geometry
    causal_parents: []
    verification: measured_on_driven_line
    validation_owner: tracks/validate.py check `grade_bounded`
    availability: available
    caveat: >-
      OpenF1 z is the noisiest channel. Suzuka was rejected on this check
      because isolated samples implied gradients near 0.9.

  - id: track.corridor_width
    meaning: Usable left and right width around the centreline.
    units: m
    simulator_role: >-
      Would bound lateral displacement and permit side-by-side and contact
      reasoning.
    source: none available
    observation_source: reported as null, never as a number
    missing_behaviour: >-
      Lateral motion is disabled (the car holds the centreline), the observation
      channel is null, and every overlap or contact claim is refused.
    supported_range: null
    distribution_family: null
    correlation_group: geometry
    causal_parents: []
    verification: unavailable
    validation_owner: tracks/validate.py check `corridor`
    availability: unavailable
    caveat: >-
      Location telemetry cannot establish legal boundaries. This is why no
      circuit can reach `simulation_eligible`.

  - id: air.density
    meaning: Moist-air density at the car.
    units: kg/m3
    simulator_role: Scales aerodynamic drag and downforce.
    source: >-
      Derived from measured pressure, air temperature and humidity in the
      conditions tape (ideal-gas limit with a Magnus humidity correction);
      barometric fallback from altitude when pressure is unknown.
    observation_source: not exposed directly; enters through observed speed and power
    missing_behaviour: falls back to the car document's declared reference density, labelled as such
    supported_range: [0.85, 1.30]
    distribution_family: empirical per circuit and season window
    correlation_group: atmosphere
    causal_parents: [air.pressure, air.temperature, air.humidity]
    verification: measured_station_reading
    validation_owner: conditions/atmosphere.py
    availability: available
    caveat: >-
      A trackside station reading, not a certified condition, and taken from a
      2025 session used as context for a 2026 rule set.

  - id: air.wind
    meaning: Wind speed and direction, projected onto the local track heading.
    units: m/s
    simulator_role: >-
      Raises or lowers the air speed the drag term sees without changing ground
      speed. Projected per lap position, because a single global headwind sign
      is wrong on a closed circuit.
    source: conditions tape
    observation_source: not exposed directly
    missing_behaviour: still air, labelled as the static reference
    supported_range: [0.0, 30.0]
    distribution_family: empirical, temporally persistent
    correlation_group: atmosphere
    causal_parents: []
    verification: measured_station_reading
    validation_owner: conditions/wind.py
    availability: available

  - id: surface.grip_multiplier
    meaning: Multiplier on the surface friction coefficient.
    units: "1"
    simulator_role: >-
      Scales the tyre friction envelope, so it sets braking distance, cornering
      speed and, through the stability law, usable regeneration.
    source: >-
      Reduced model over rainfall state, track temperature and rubbering-in.
      Coefficients are engineering assumptions.
    observation_source: wet flag and a grip estimate with uncertainty
    missing_behaviour: dry reference 1.0, labelled as the static reference
    supported_range: [0.30, 1.05]
    distribution_family: regime-conditioned
    correlation_group: surface
    causal_parents: [air.temperature, weather.rainfall]
    verification: synthetic_assumption
    validation_owner: conditions/grip.py
    availability: available
    caveat: >-
      Not calibrated against speed or braking residuals. The specification asks
      for that calibration and it has not been done.

  - id: tyre.compound_and_age
    meaning: Categorical compound plus continuous age, temperature and wear.
    units: mixed
    simulator_role: Traction, rolling loss and braking stability.
    source: synthetic assumption
    observation_source: own state estimated; rival tyre state is a hidden hypothesis
    missing_behaviour: a single declared reference compound, labelled synthetic
    supported_range: null
    distribution_family: null
    correlation_group: tyres
    causal_parents: [surface.grip_multiplier]
    verification: synthetic_assumption
    validation_owner: conditions/tyres.py
    availability: degraded
    caveat: >-
      Public stint data gives declared compound and lap age, never carcass
      state. No thermodynamic tyre model is claimed.

  - id: vehicle.aero_and_mass
    meaning: Drag area, lift area and mass.
    units: mixed
    simulator_role: The aerodynamic and inertial terms of the force balance.
    source: car document
    observation_source: not exposed
    missing_behaviour: none; a car document is required
    supported_range: null
    distribution_family: null
    correlation_group: vehicle
    causal_parents: []
    verification: synthetic_assumption
    validation_owner: configs/cars/
    availability: available
    caveat: A sketch of a 2026 car, not a measured one.

  - id: vehicle.deploy_ceiling
    meaning: DC-bus electrical deployment ceiling in force at this instant.
    units: W
    simulator_role: Caps the electrical contribution to shaft power.
    source: >-
      Car document ceiling, multiplied by the battery thermal derate and capped
      by the event Power Unit Information curve when two reviewers have
      confirmed it.
    observation_source: exposed as a deployment ceiling, and at the lookahead points
    missing_behaviour: >-
      An unknown or unreviewed event curve never widens the limit; the
      car-document ceiling applies and the step records `event_curve_unknown`.
    supported_range: [0.0, 350000.0]
    distribution_family: null
    correlation_group: vehicle
    causal_parents: [vehicle.battery_temperature, rules.event_power_curve]
    verification: synthetic_assumption
    validation_owner: simulation/energy_limits.py
    availability: available

  - id: vehicle.recovery_ceiling
    meaning: DC-bus recovery ceiling for the braking power currently applied.
    units: W
    simulator_role: >-
      Caps regenerated power. Braking power not admitted stays on the friction
      brakes, so wheel work is never counted twice.
    source: >-
      Minimum of the motor ceiling, the regen share of mechanical braking, a
      grip-and-stability law and the battery charge-acceptance ramp.
    observation_source: exposed as a recovery ceiling, and at the lookahead points
    missing_behaviour: not applicable; always computable from declared values
    supported_range: [0.0, 350000.0]
    distribution_family: null
    correlation_group: vehicle
    causal_parents: [surface.grip_multiplier, vehicle.battery_temperature]
    verification: synthetic_assumption
    validation_owner: simulation/energy_limits.py
    availability: available
    caveat: >-
      Historical deceleration does not reveal how much a real car recovers.
      Friction split, battery acceptance and motor limits decide that, and none
      of those is public.

  - id: vehicle.battery_temperature
    meaning: Lumped battery temperature.
    units: K
    simulator_role: Drives the deployment derate and the charge-acceptance limit.
    source: lumped thermal model over declared heat capacity and transfer coefficient
    observation_source: exposed with thermal headroom
    missing_behaviour: none; integrated from the initial state
    supported_range: [270.0, 360.0]
    distribution_family: null
    correlation_group: vehicle
    causal_parents: [vehicle.deploy_ceiling, vehicle.recovery_ceiling, air.temperature]
    verification: synthetic_assumption
    validation_owner: simulation/engine.py thermal update
    availability: available

  - id: traffic.longitudinal_gap
    meaning: Separation to the car ahead.
    units: m
    simulator_role: >-
      Sets the aerodynamic interaction (tow) applied to the follower's drag and
      downforce.
    source: simulator truth, exposed to the controller as a noisy delayed gap
    observation_source: gap ahead and relative progress, with observation age
    missing_behaviour: no car in range means multipliers of exactly 1.0
    supported_range: [0.0, 200.0]
    distribution_family: scenario-conditioned
    correlation_group: traffic
    causal_parents: []
    verification: synthetic_assumption
    validation_owner: simulation/wake.py
    availability: available
    caveat: >-
      A tow can be estimated from longitudinal separation. Side-by-side space
      cannot, so it is refused while the corridor is unknown.

  - id: human.reaction_delay
    meaning: Delay between an instruction and the driver acting on it.
    units: s
    simulator_role: Decides when a plan can physically begin.
    source: driver document, drawn from keyed random streams
    observation_source: delay mean and spread are exposed as a belief
    missing_behaviour: none; a driver document is required
    supported_range: [0.0, 2.0]
    distribution_family: normal, truncated at zero
    correlation_group: human
    causal_parents: []
    verification: synthetic_assumption
    validation_owner: configs/scenarios/ driver blocks
    availability: available

# --------------------------------------------------------------------------- #
# 2. Reward coefficients: declared priorities, frozen before evaluation
# --------------------------------------------------------------------------- #
#
# These are NOT physics and NOT learned. They are read from the frozen
# objective document; the values live there and are not duplicated here, so the
# two can never drift apart.

reward_coefficients:
  objective_revision: objective-v1
  document: configs/objectives/objective-v1.yaml
  frozen_before_any_benchmark_result: true
  terms:
    - id: elapsed_second_penalty
      rationale: >-
        One simulated second of elapsed time costs one unit, which fixes the
        scale of everything else in the objective.
    - id: instruction_change_penalty
      rationale: >-
        Charged when the engineer's call changes, so a policy cannot assume a
        driver will absorb a new instruction every second.
    - id: finish_position_penalty
      rationale: >-
        Prices a lost position against elapsed time. A hypothesis about product
        priority, not a measured exchange rate.
    - id: terminal_failure_penalty
      rationale: >-
        Must exceed the discounted running cost plus the worst finish-position
        cost, or retiring becomes profitable. The contract model re-derives and
        enforces that bound.
    - id: lambda_tail
      rationale: >-
        Weight on the conditional value at risk, so a strategy is not chosen on
        its mean while carrying an unacceptable poor tail.
    - id: lambda_switch
      rationale: Suppresses instruction chatter alongside a minimum dwell time.
    - id: disagreement_penalty_weight
      rationale: >-
        Applied to the learned continuation contribution only. A conservative
        heuristic, not a safety guarantee.
  hard_constraints_are_not_coefficients: >-
    Rules and physical limits are hard constraints enforced by the independent
    checker, in training and in serving. A large penalty is not a proof that a
    policy will never violate a limit, so no violation is priced here.

# --------------------------------------------------------------------------- #
# 3. Policy features: observed, never weighted here
# --------------------------------------------------------------------------- #

policy_features:
  feature_revision: energy-v1
  manifest: afterlap_core.feature_manifest.ENERGY_V1
  no_per_feature_importance_is_published: >-
    A neural actor does not provide one stable meaningful weight per input.
    Scaling, correlation and operating state change apparent influence, so this
    registry publishes none. Influence is reported only through the
    interventions listed below, each naming circuit, state, action, baseline and
    uncertainty.
  inclusion_rule: >-
    A factor becomes a feature only when it is observable at decision time,
    changes the value of an action, and can be supported or calibrated. More
    features can worsen sample efficiency and create leakage.
  excluded_deliberately:
    - id: track_identity
      reason: >-
        Track id, name, hash and index are excluded from actor features so the
        policy cannot memorise a circuit as a shortcut. The id remains available
        to logging and to event-package selection.
    - id: simulator_truth
      reason: >-
        Private simulator state never crosses into the observation, including a
        rival's true stored energy, which stays a hidden hypothesis.
    - id: future_measurements
      reason: >-
        The policy never receives future weather or a future race-control event.
        Known future geometry is permitted, because the circuit ahead is known.
  every_value_is_masked: >-
    The observation carries one presence mask per value, so an unavailable
    channel is explicit and is never silently encoded as zero.

# --------------------------------------------------------------------------- #
# 4. How influence may be reported
# --------------------------------------------------------------------------- #

influence_methods:
  methods:
    - id: paired_single_factor_intervention
      method: >-
        Replay one snapshot and one random tape, change one factor within its
        supported range, and measure the change in action and in outcome.
      reports: action delta, outcome delta, sample count, interval
    - id: group_ablation
      method: Mask one permitted factor group and retrain under the same budget.
      reports: dependence plus adaptation, which is not intrinsic importance
    - id: policy_occlusion
      method: >-
        At inference, replace one group with its training reference
        distribution.
      reports: output change, conditional on the correlation structure
    - id: global_sensitivity
      method: Sobol or Morris analysis over selected physical parameters.
      reports: parameter ranges and interactions
    - id: counterfactual_regret
      method: >-
        Compare the chosen action with feasible alternatives from the same
        snapshot against responsive rivals.
      reports: regret against the feasible set
  forbidden_reporting: >-
    A statement of the form "weather was 18 percent important" without a named
    metric and experiment is not a permitted output of this system.

# --------------------------------------------------------------------------- #
# 5. Evidence questions, deliberately unanswered
# --------------------------------------------------------------------------- #
#
# The specification lists these as experiments. Results are not prefilled and
# no measured answer exists yet.

open_evidence_questions:
  - "Does wind direction change the preferred deployment point on a long straight once it is rotated through track heading?"
  - "Does lower grip reduce recoverable energy and move the optimal attack later?"
  - "Does a wider rival-energy belief increase the reserve the controller holds?"
  - "Does high altitude change drag, downforce and cooling consistently rather than through a track label?"
  - "Does the actor stay stable when an irrelevant field changes?"
  - "Does removing track lookahead materially hurt transfer to held-out geometry?"
