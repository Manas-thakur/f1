# Ordinary continuation-return ensemble — A07-owned.
#
# Settings from 07_learning/VALUE_AND_CALIBRATION.md. The ensemble estimates the
# ordinary discounted continuation return under the NAMED frozen controller
# below. It contains no SAC entropy term and it is not a universal optimal value
# function.

id: value-v1
synthetic: true

members: 5
hidden: [256, 256]
learning_rate: 0.001
batch_size: 512
weight_decay: 0.0001
huber_delta: 1.0
max_epochs: 200
patience: 10

# The controller the labels were generated under. A bundle fitted against a
# different controller must name that controller instead; the two are not
# interchangeable.
continuation_controller: mpc-only/planner-v1/no_rollout

# Frozen gates that disable learned scoring outside its validated regime.
#
# NOT YET DERIVED FROM CALIBRATION DATA. `frozen_before_final_test` is false and
# stays false until a real calibration set exists. A constant chosen after
# seeing a loss is not a valid deployment gate, so these values are placeholders
# that keep the gate CONSERVATIVE (they disable learned scoring readily) rather
# than permissive.
support_thresholds:
  max_ensemble_disagreement: 5.0
  max_clip_fraction: 0.10
  min_known_mask_fraction: 0.60
  frozen_before_final_test: false
