# Promotion policy — coordinator-owned.
#
# 07_learning/TRAINING_AND_PROMOTION.md requires the coordinator to freeze a
# meaningful benefit margin and non-inferiority limits BEFORE training, and
# certainly before the final test set is opened. Values chosen after seeing a
# result are not a deployment gate.
#
# STATUS: thresholds below are frozen. `enabled` stays false until a candidate
# has actually been evaluated against them; the system refuses promotion when
# evidence is missing, which is the intended default.

id: promotion-v1
synthetic: true
enabled: false

frozen_at: "2026-09-08T00:00:00Z"

benefit:
  # Primary objective: mean paired difference in dimensionless utility against
  # the MPC-only baseline, over independent test scenarios.
  metric: utility_difference_vs_mpc_only
  # A candidate must beat MPC-only by at least this much, with the whole 95%
  # paired-bootstrap interval on the favourable side of zero.
  minimum_benefit: 2.0
  require_interval_excludes_zero: true
  interval_coverage: 0.95

rationale: >-
  The running cost is one unit per simulated second, so a benefit of 2.0 utility
  units corresponds to roughly two seconds of equivalent race time over the
  evaluated segment, before position terms. That is large enough not to be
  noise on a 100-scenario paired study, and small enough to be reachable if the
  learned contribution helps at all. This number was chosen from the objective's
  own scale before any candidate existed, not from an observed result.

non_inferiority:
  # The candidate must not make the bad cases worse.
  downside_noninferiority_limit: 1.0
  downside_metric: cvar_0.9_utility_loss
  # Planner latency must stay inside the declared runtime budget.
  latency_limit_ms: 200.0
  latency_percentile: 95
  # A method must not look better by declining hard scenarios.
  max_withdrawn_decision_rate: 0.05
  # Any modelled rule or physical violation is disqualifying.
  max_modelled_violations: 0

evidence_required:
  - held_out_test_manifest_frozen_before_training
  - at_least_100_independent_test_scenarios
  - at_least_5_training_seeds
  - hierarchical_paired_bootstrap_over_scenarios_and_seeds
  - ablation_disabling_only_the_learned_terminal_value
  - ablation_disabling_only_the_policy_warm_start
  - equal_observation_access_and_equal_solver_compute_allowance
  - failed_and_withdrawn_decisions_retained_in_denominators

refusal_conditions:
  - thresholds_missing_or_not_frozen
  - benchmark_report_absent
  - feature_schema_hash_mismatch
  - rule_family_mismatch
  - test_set_reused_after_informing_a_redesign

note: >-
  A candidate that fails these gates leaves the learned contribution disabled
  and the validated MPC-only baseline in place. That is a valid research result,
  not a build failure. Promotion is a separate decision from implementation
  completeness.
