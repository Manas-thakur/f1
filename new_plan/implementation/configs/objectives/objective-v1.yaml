# Objective revision objective-v1 — coordinator-owned and frozen.
#
# This is the declared trade-off used to rank legal candidates. It is
# dimensionless. It is NOT seconds: finish position and elapsed time are
# reported separately and are never replaced by this number.
#
# Frozen before any benchmark result exists. Changing any value here requires a
# new objective revision and invalidates every comparison made under the old
# one.

id: objective-v1
synthetic: true
description: >-
  Initial commissioning objective. Coefficients are engineering hypotheses
  chosen from the specification's stated bounds, not measured optima.

utility:
  # Running cost. One simulated second of elapsed time costs one unit.
  elapsed_second_penalty:
    value: 1.0
    unit: "1/s"
    source: 07_learning/ENVIRONMENT_AND_FEATURES.md reward revision objective-v1
    verification: synthetic_assumption

  # Charged when the engineer's instruction changes, so the policy cannot rely
  # on a driver reacting to a new call every second.
  instruction_change_penalty:
    value: 0.1
    unit: "1"
    source: 07_learning/ENVIRONMENT_AND_FEATURES.md reward revision objective-v1
    verification: synthetic_assumption

  finish_position_penalty:
    value: 30.0
    unit: "1/position"
    source: 07_learning/ENVIRONMENT_AND_FEATURES.md reward revision objective-v1
    verification: synthetic_assumption

  # Must exceed the discounted running-cost bound plus the worst finish-position
  # cost, or deliberately retiring becomes profitable. The contract model
  # RewardManifest re-derives and enforces this bound.
  terminal_failure_penalty:
    value: 1200.0
    unit: "1"
    source: 07_learning/ENVIRONMENT_AND_FEATURES.md reward revision objective-v1
    verification: synthetic_assumption

  potential_reference_time_scale_s:
    value: 100.0
    unit: s
    source: 07_learning/ENVIRONMENT_AND_FEATURES.md potential shaping
    verification: synthetic_assumption

discount:
  gamma:
    value: 0.9966722160545233
    unit: "1"
    source: exp(-1/300) at a one-second policy cadence
    verification: synthetic_assumption
  horizon_s:
    value: 300.0
    unit: s
    source: 07_learning/ENVIRONMENT_AND_FEATURES.md delayed-consequence horizon
    verification: synthetic_assumption

# Poor-tail treatment. CVaR at this level is added to the expected utility with
# the weight below, using the auxiliary-variable formulation in
# 06_planning/OPTIMIZATION.md.
tail:
  alpha:
    value: 0.9
    unit: "1"
    source: 06_planning/OPTIMIZATION.md CVaR formulation
    verification: synthetic_assumption
  lambda_tail:
    value: 0.25
    unit: "1"
    source: 06_planning/OPTIMIZATION.md objective manifest
    verification: synthetic_assumption

switching:
  lambda_switch:
    value: 0.1
    unit: "1"
    source: 06_planning/TECHNICAL_SPEC.md instruction-switch cost
    verification: synthetic_assumption
  minimum_dwell_s:
    value: 3.0
    unit: s
    source: 06_planning/TECHNICAL_SPEC.md chatter suppression
    verification: synthetic_assumption
  improvement_threshold:
    value: 0.75
    unit: "1"
    source: 06_planning/TECHNICAL_SPEC.md improvement threshold
    verification: synthetic_assumption

# Applied to the learned continuation contribution only. A conservative
# heuristic, not a mathematical safety guarantee.
learned_scoring:
  disagreement_penalty_weight:
    value: 0.5
    unit: "1"
    source: 07_learning/VALUE_AND_CALIBRATION.md disagreement penalty
    verification: synthetic_assumption

bounds_assumed:
  maximum_supported_field_size: 20
  maximum_charged_instruction_changes_per_s: 1.0
  note: >-
    The failure-penalty bound is derived from these assumptions. A scenario
    family outside them must recompute the bound before use.

reporting:
  # Physical outcomes are always reported separately from the utility above.
  separate_physical_metrics:
    - finish_position
    - elapsed_time_s
    - retained_pass_at_checkpoint
    - energy_at_checkpoint_j
    - modelled_constraint_violations
    - withdrawn_decisions
