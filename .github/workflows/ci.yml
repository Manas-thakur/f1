name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-packages --all-groups
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Comment policy
        run: uv run python scripts/check_no_comments.py
      - name: Docs package
        run: uv run python docs/tools/validate_package.py
      - name: Schema drift
        run: uv run python -m afterlap_contracts.schema_export --check
      - name: Doctor
        run: uv run python -m afterlap_core.cli doctor
      - name: Tests
        run: uv run pytest --junitxml=python-results.xml

      - name: Python results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-results
          path: python-results.xml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Types
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Install Playwright browser
        run: bunx playwright install chromium
      - name: Playwright
        run: bun run test:e2e
      - name: Browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: apps/web/test-results


  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install Python
        run: uv sync --frozen --all-packages
      - name: Cross-platform Python contracts
        run: uv run pytest tests/operations/test_platform_portability.py tests/operations/test_model_regime.py tests/operations/test_worker_heartbeat.py tests/operations/test_session_process_runtime.py
      - name: Install web
        run: bun install --frozen-lockfile
      - name: Cross-platform web types
        run: bun run typecheck

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_USER: afterlap
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: afterlap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afterlap"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Frozen dependencies
        run: |
          uv sync --frozen --all-packages --all-groups
          bun install --frozen-lockfile
      - name: Production website
        run: bun run build
      - name: Browser
        run: bun run e2e:install
      - name: Live PostgreSQL, runtime, worker and browser audit
        env:
          AFTERLAP_AUDIT_DATABASE_URL: postgresql+psycopg://afterlap:integration-test@127.0.0.1:5432/afterlap
        run: uv run --no-sync python scripts/audit.py --live-only --output "${{ runner.temp }}/audit"
      - name: Integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-audit
          path: |
            ${{ runner.temp }}/audit/*.log
            ${{ runner.temp }}/audit/*.png
            ${{ runner.temp }}/audit/summary.json
            apps/web/test-results
