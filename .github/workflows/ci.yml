name: simulator

on:
  push:
    branches: [main, simulator, branding, "codex/battery-includes", "feat/simulator-3d-ui", "feat/race-physics-realism", "feat/simulator-integration"]
  pull_request:
    branches: [main, simulator, branding, "codex/battery-includes", "feat/simulator-3d-ui", "feat/race-physics-realism", "feat/simulator-integration"]
  workflow_dispatch:

concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-packages
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Comment policy
        run: uv run python scripts/check_no_comments.py
      - name: Race and physics tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: |
          uv sync --frozen --all-packages
          bun install --frozen-lockfile || bun install --frozen-lockfile
      - name: Lint and types
        run: |
          bun run lint
          bun run typecheck
      - name: Production build
        run: bun run build
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Live race and forwarded connection
        run: make race-browser-check

  training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install CPU training dependencies
        run: uv sync --frozen --all-packages --group learning
      - name: Generate transitions
        run: make race-generate CIRCUIT=monza CARS=2 LAPS=1 DURATION=5
      - name: Train a policy
        run: make race-train CIRCUIT=monza CARS=1 LAPS=1 DURATION=8 STEPS=128
      - name: Train and evaluate the energy decision policy
        run: |
          make race-train-decision CIRCUIT=monza DECISION_CARS=2 LAPS=1 DECISION_DURATION=2 STEPS=64 CYCLES=1 EVAL_EPISODES=1 TRAINING_OUTPUT=.afterlap/race/boost-smoke
          make race-evaluate-decision CIRCUIT=monza DECISION_CARS=2 LAPS=1 DECISION_DURATION=2 EVAL_EPISODES=1 POLICY=.afterlap/race/boost-smoke
