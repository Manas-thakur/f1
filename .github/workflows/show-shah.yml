name: show-shah

on:
  pull_request:
    branches: [main]
    paths: ['show-shah/**', 'bun.lock', 'package.json', '.github/workflows/show-shah.yml']
  push:
    branches: [main]
    paths: ['show-shah/**', 'bun.lock', 'package.json', '.github/workflows/show-shah.yml']
  workflow_dispatch:

concurrency:
  group: show-shah-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: show-shah
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Check sources, types and build
        run: bun run check
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Export and inspect every slide
        run: |
          bun run preview &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          bun run export
      - name: Render a representative frame from every chapter
        run: bunx remotion render src/video.tsx ShowShah dist/chapter-check --frames=180,540,900,1260,1620,1980,2340,2700,3060,3420,3780,4140 --concurrency=2 --gl=swangle
      - name: Validate committed exports
        run: |
          mkdir -p .build
          bunx remotion ffmpeg -v error -xerror -i exports/show-shah.mp4 -c:v rawvideo -f null -
          bunx remotion ffprobe -v error -show_streams -show_format -of json exports/show-shah.mp4 > .build/video-info.json
          python3 scripts/verify_exports.py
          cp exports/show-shah.mp4 dist/show-shah.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: show-shah-presentation-and-demo
          path: show-shah/dist
          retention-days: 14
