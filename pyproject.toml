[tool.mypy]
python_version = "3.12"
files = ["packages", "apps/api", "scripts", "tests", "workers", "docs/tools/validate_package.py"]
exclude = ["packages/contracts/generated", "apps/web", "docs/deck", "docs/tools/complete_package.py", "docs/tools/revise_design.py", ".venv/"]
explicit_package_bases = true
mypy_path = "packages/application:packages/contracts:packages/core:packages/infrastructure:apps/api:scripts"
namespace_packages = true
pretty = true
show_error_codes = true
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = true
no_implicit_reexport = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "casadi",
    "casadi.*",
]
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "stable_baselines3",
    "stable_baselines3.*",
    "gymnasium",
    "gymnasium.*",
    "tensorboard",
    "tensorboard.*",
    "skl2onnx",
    "skl2onnx.*",
    "pypdf",
    "pypdf.*",
    "pyarrow",
    "pyarrow.*",
    "scipy",
    "scipy.*",
    "torch",
    "torch.*",
    ]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["afterlap_contracts.fixtures", "afterlap_contracts.schema_export"]
disable_error_code = ["arg-type", "return-value", "no-any-return"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = [
    "arg-type",
    "attr-defined",
    "union-attr",
    "operator",
    "var-annotated",
    "unreachable",
    "comparison-overlap",
]
