[dependency-groups]
runtime = ["afterlap-api[postgres]"]
data = ["afterlap-core[data]"]
solver = ["afterlap-core[solver]"]
track-ingestion = ["afterlap-core[track-ingestion]"]
learning = ["afterlap-core[learning]"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.uv]
default-groups = ["runtime", "dev"]

[tool.uv.workspace]
members = [
    "packages/application",
    "packages/contracts",
    "packages/core",
    "packages/infrastructure",
    "apps/api",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
afterlap-application = { workspace = true }
afterlap-contracts = { workspace = true }
afterlap-core = { workspace = true }
afterlap-infrastructure = { workspace = true }
afterlap-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-q --strict-markers --strict-config -p afterlap_pytest_plugin"
markers = [
    "slow: long-running (training / large benchmark) test",
    "solver: requires an optimisation solver backend",
    "torch: requires PyTorch",
    "db: requires a database engine",
]
filterwarnings = ["error::DeprecationWarning:afterlap_.*"]
xfail_strict = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages", "apps/api", "scripts", "workers", "tests"]
extend-exclude = [
    "packages/contracts/generated",
    "apps/web",
    "docs/deck",
    "docs/design/mockups",
    "docs/tools/complete_package.py",
    "docs/tools/revise_design.py",
    "docs/**/*.md",
    "new_plan",
    "**/._*",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "ANN",
    "ASYNC",
    "S",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "T20",
    "EM",
    "EXE",
    "FA",
    "FBT",
    "INP",
    "INT",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "NPY",
    "PGH",
    "PIE",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "SLOT",
    "TID",
    "TC",
    "ARG",
    "PTH",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "FURB",
    "RUF",
    "ERA",
    "BLE",
    "YTT",
    "C90",
]
ignore = [
    "COM812",
    "ISC001",
    "ANN401",
    "PLR2004",
    "TRY003",
    "EM101",
    "EM102",
    "TC001",
    "TC002",
    "TC003",
    "TID252",
    "PLC0415",
    "N818",
    "S101",
    "TRY004",
    "TRY300",
    "PERF401",
]
preview = false

[tool.ruff.lint.isort]
known-first-party = [
    "afterlap_application",
    "afterlap_contracts",
    "afterlap_core",
    "afterlap_infrastructure",
    "afterlap_api",
    "afterlap_ops",
]
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 18
max-returns = 10
max-statements = 100

[tool.ruff.lint.per-file-ignores]
"apps/api/afterlap_api/cli.py" = ["FBT001", "FBT002"]
