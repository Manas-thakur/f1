[project]
name = "afterlap"
version = "0.1.0"
description = "AFTERLAP - electrical energy and overtake decision support (synthetic, simulator-only)"
requires-python = "==3.12.*"
dependencies = [
    "afterlap-contracts",
    "afterlap-core",
    "afterlap-api",
]

[project.optional-dependencies]
learning = ["torch>=2.4,<3", "gymnasium>=1.0,<2", "stable-baselines3>=2.4,<3", "scikit-learn>=1.5,<2", "tensorboard>=2.17"]
solver = ["casadi>=3.6,<4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
]

[tool.uv.workspace]
members = ["packages/contracts", "packages/core", "apps/api"]

[tool.uv.sources]
afterlap-contracts = { workspace = true }
afterlap-core = { workspace = true }
afterlap-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running (training / large benchmark) test",
    "solver: requires an optimisation solver backend",
    "torch: requires PyTorch",
    "db: requires a database engine",
]
filterwarnings = ["error::DeprecationWarning:afterlap_.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["packages/contracts/generated", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["afterlap_contracts", "afterlap_core", "afterlap_api"]

[tool.ruff.lint.per-file-ignores]
# The staging-then-rename write deliberately keeps the handle past the with-block.
"packages/core/afterlap_core/paths.py" = ["SIM115"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["packages/contracts/generated", "apps/web"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
