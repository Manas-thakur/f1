[dependency-groups]
learning = ["afterlap-core[learning]"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "hypothesis>=6.112", "ruff>=0.7", "mypy>=1.13", "types-pyyaml>=6.0"]

[tool.uv.workspace]
members = ["packages/contracts", "packages/core", "apps/api"]

[tool.uv.sources]
afterlap-contracts = { workspace = true }
afterlap-core = { workspace = true }
afterlap-api = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-q --strict-markers --strict-config"
markers = ["slow: long-running numerical validation"]
xfail_strict = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages", "apps/api", "scripts", "tests"]
extend-exclude = [
    "packages/contracts/generated",
    "apps/web",
    "docs/deck",
    "docs/design/mockups",
    "docs/tools/complete_package.py",
    "docs/tools/revise_design.py",
    "docs/**/*.md",
    "new_plan",
    "**/._*",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "ANN",
    "ASYNC",
    "S",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "FA",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PIE",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "TC",
    "ARG",
    "PTH",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "FURB",
    "RUF",
    "ERA",
    "C90",
]
ignore = [
    "COM812",
    "ISC001",
    "B008",
    "RUF012",
    "ANN401",
    "PLR0913",
    "PLR2004",
    "TRY003",
    "EM101",
    "EM102",
    "TC001",
    "TC002",
    "TC003",
    "TC006",
    "TID252",
    "PLC0415",
    "S101",
    "S105",
    "S106",
    "S110",
    "S112",
    "S310",
    "S608",
    "N818",
    "ARG001",
    "ARG002",
    "ARG005",
    "PERF401",
    "PTH105",
    "SLF001",
    "PLW0603",
    "PLR0124",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "C901",
    "TRY300",
    "TRY004",
    "PT012",
    "PT019",
]
preview = false

[tool.ruff.lint.isort]
known-first-party = [
    "afterlap_contracts",
    "afterlap_core",
    "afterlap_api",
]
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 40

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 24
max-returns = 12
max-statements = 120

[tool.ruff.lint.per-file-ignores]
"packages/core/afterlap_core/paths.py" = ["SIM115"]
"tests/**/*.py" = ["S101", "PLR2004", "ANN001", "ANN201", "ANN202", "ANN002", "ANN003", "ANN204", "PT018", "PT011", "E402"]
"scripts/**/*.py" = ["T201"]
"scripts/race_stack.py" = ["S603"]
"scripts/check_no_comments.py" = ["C901", "PLR0912", "T201"]
"scripts/demo.py" = ["PLR0915", "T201"]
"docs/tools/**/*.py" = ["T201", "S110"]
"workers/**/*.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
files = ["packages", "apps/api", "scripts"]
explicit_package_bases = true
mypy_path = "packages/contracts:packages/core:apps/api:scripts"
namespace_packages = true
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["afterlap_core.*", "afterlap_api.*"]
disable_error_code = ["arg-type", "attr-defined", "union-attr", "no-any-return", "operator", "type-arg", "comparison-overlap", "unreachable", "misc", "call-arg", "no-untyped-call", "var-annotated", "index", "assignment", "return-value"]
