[project]
name = "afterlap"
version = "0.1.0"
description = "AFTERLAP - electrical energy and overtake decision support (synthetic, simulator-only)"
requires-python = "==3.12.*"
dependencies = [
    "afterlap-contracts",
    "afterlap-core",
    "afterlap-api",
]

[project.optional-dependencies]
learning = ["torch>=2.4,<3", "gymnasium>=1.0,<2", "stable-baselines3>=2.4,<3", "scikit-learn>=1.5,<2", "tensorboard>=2.17"]
solver = ["casadi>=3.6,<4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
]

[tool.uv.workspace]
members = ["packages/contracts", "packages/core", "apps/api"]

[tool.uv.sources]
afterlap-contracts = { workspace = true }
afterlap-core = { workspace = true }
afterlap-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
pytest_plugins = ["afterlap_pytest_plugin"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: long-running (training / large benchmark) test",
    "solver: requires an optimisation solver backend",
    "torch: requires PyTorch",
    "db: requires a database engine",
]
filterwarnings = ["error::DeprecationWarning:afterlap_.*"]
xfail_strict = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages", "apps/api", "scripts", "workers", "tests"]
extend-exclude = [
    "packages/contracts/generated",
    "apps/web",
    "docs/deck",
    "docs/design/mockups",
    "docs/tools/complete_package.py",
    "docs/tools/revise_design.py",
    "docs/**/*.md",
    "new_plan",
    "**/._*",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "ANN",
    "ASYNC",
    "S",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "FA",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PIE",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "TC",
    "ARG",
    "PTH",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "FURB",
    "RUF",
    "ERA",
    "C90",
]
ignore = [
    "COM812",
    "ISC001",
    "B008",
    "RUF012",
    "ANN401",
    "PLR0913",
    "PLR2004",
    "TRY003",
    "EM101",
    "EM102",
    "TC001",
    "TC002",
    "TC003",
    "TC006",
    "TID252",
    "PLC0415",
    "S101",
    "S105",
    "S106",
    "S110",
    "S112",
    "S310",
    "S608",
    "N818",
    "ARG001",
    "ARG002",
    "ARG005",
    "PERF401",
    "PTH105",
    "SLF001",
    "PLW0603",
    "PLR0124",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "C901",
    "TRY300",
    "TRY004",
    "PT012",
    "PT019",
]
preview = false

[tool.ruff.lint.isort]
known-first-party = ["afterlap_contracts", "afterlap_core", "afterlap_api", "afterlap_ops"]
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 40

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 24
max-returns = 12
max-statements = 120

[tool.ruff.lint.per-file-ignores]
"packages/core/afterlap_core/paths.py" = ["SIM115"]
"tests/**/*.py" = ["S101", "PLR2004", "ANN001", "ANN201", "ANN202", "ANN002", "ANN003", "ANN204", "PT018", "PT011", "E402"]
"scripts/**/*.py" = ["T201"]
"scripts/check_no_comments.py" = ["C901", "PLR0912", "T201"]
"scripts/demo.py" = ["PLR0915", "T201"]
"docs/tools/**/*.py" = ["T201", "S110"]
"workers/**/*.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
files = ["packages", "apps/api", "scripts", "tests", "docs/tools/validate_package.py"]
exclude = ["packages/contracts/generated", "apps/web", "docs/deck", "docs/tools/complete_package.py", "docs/tools/revise_design.py", "workers/", ".venv/"]
explicit_package_bases = true
mypy_path = "packages/contracts:packages/core:apps/api:scripts"
namespace_packages = true
pretty = true
show_error_codes = true
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = true
no_implicit_reexport = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
strict_equality = true
extra_checks = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "casadi",
    "casadi.*",
]
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "stable_baselines3",
    "stable_baselines3.*",
    "gymnasium",
    "gymnasium.*",
    "tensorboard",
    "tensorboard.*",
    "skl2onnx",
    "skl2onnx.*",
    "pypdf",
    "pypdf.*",
    "prometheus_client",
    "prometheus_client.*",
    "pyarrow",
    "pyarrow.*",
    "scipy",
    "scipy.*",
    "torch",
    "torch.*",
    "acados_template",
    "acados_template.*",
    "afterlap_core.runner",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["afterlap_contracts.fixtures", "afterlap_contracts.schema_export"]
disable_error_code = ["arg-type", "return-value", "no-any-return"]

[[tool.mypy.overrides]]
module = ["demo", "release_bundle", "batch_worker_main", "doctor", "migrate", "afterlap_ops.*", "batch_worker", "session_worker"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["afterlap_core.*", "afterlap_api.*"]
disable_error_code = [
    "arg-type",
    "attr-defined",
    "union-attr",
    "no-any-return",
    "operator",
    "type-arg",
    "comparison-overlap",
    "unreachable",
    "misc",
    "call-arg",
    "no-untyped-call",
    "var-annotated",
    "index",
    "assignment",
    "return-value",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = [
    "arg-type",
    "attr-defined",
    "union-attr",
    "no-any-return",
    "operator",
    "type-arg",
    "name-defined",
    "no-untyped-def",
    "var-annotated",
    "unreachable",
    "comparison-overlap",
    "assignment",
    "return-value",
    "misc",
    "no-untyped-call",
    "index",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
