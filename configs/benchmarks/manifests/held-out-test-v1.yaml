# Held-out test manifest, declared but NOT YET SUFFICIENT.
#
# SYNTHETIC. learning/SERVING_AND_EVALUATION.md sets an initial study target
# of at least 100 independent test scenarios, stratified across scenario
# families, evaluated for each of five training seeds. This package ships five
# synthetic scenarios across two synthetic tracks. Five scenarios by five seeds
# is 25 independent units, which is a quarter of the declared scenario target
# and cannot support a promotion decision.
#
# This file exists so that the shape of the held-out manifest is frozen before
# training, as the plan requires, and so that the gap between the declared
# target and the shipped population is visible and machine-readable rather than
# discovered later. Opening this manifest is a deliberate act; the harness
# records the split with every result.
id: held-out-test-v1
split: test
synthetic: true
description: >-
  Held-out test population over every shipped scenario and five seeds. The
  scenario count is below the declared study target and this manifest is
  therefore not sufficient evidence for promotion.

scenario_ids:
  - two-straight-counterattack
  - oval-defend-hold
  - oval-low-energy
  - loop-no-energy-channel
  - loop-regen-disabled

seeds: [101, 102, 103, 104, 105]

families:
  two-straight-counterattack: loop-counterattack
  loop-no-energy-channel: loop-degraded-sensing
  loop-regen-disabled: loop-degraded-recovery
  oval-defend-hold: oval-defence
  oval-low-energy: oval-low-energy

horizon_s: 30.0
dt_s: 0.02
decision_interval_s: 1.0
compute_budget_ms: 200.0
rule_pack_id: synthetic-pack-v1

checkpoint_ids: []

frozen_at: "2026-09-08T00:00:00Z"

notes:
  - "25 independent scenario/seed units against a declared target of at least
     100 independent scenarios by five seeds. The shortfall is a population
     defect, not a statistical one, and no bootstrap interval can repair it."
  - "Scenario families are stratified across two synthetic tracks only. Track
     diversity is far below what a generalisation claim would need."
  - "Opponent policy identity is not split between training and test here,
     because no training has been run. A promotion study must add that split
     before this manifest is opened for a candidate."
  - "The MPC-only baseline this manifest is meant to compare against is owned by
     A06 and is not merged, so the primary promotion metric cannot be computed."
