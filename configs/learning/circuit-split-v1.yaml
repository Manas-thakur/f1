# Frozen circuit split for RL training across real circuits (A16-7).
#
# RL_TRACK_GENERALISATION.md requires the group split to be frozen BEFORE any
# training run and recorded on every training manifest; `split_hash` is the
# content hash of this document. Changing any value here is a new split
# revision, and a candidate trained under one split is not evaluated under
# another.
#
# Track ids are the compiled package ids under artifacts/tracks/<id>/. A track
# id here is used ONLY to choose which circuit an episode runs on and which
# conditions tape is coherent with it. It never enters the actor's feature
# vector: `afterlap_core.learning.circuits.assert_no_track_identity_in_features`
# checks the frozen ENERGY_V1 manifest for that, and the sampler exposes the id
# to logging and event-package selection only.
#
# Readiness is NOT recorded here. Whether a circuit is usable is derived from
# the package's validation evidence at load time (load_track refuses anything
# below geometry_validated); a split cannot make a circuit usable.
#
# CURRENT READINESS (observation, not a declaration; re-derive, do not trust
# this comment). As of the A16-7 independent validator run:
#   monza        geometry_validated  -> sampled
#   spa          geometry_validated  -> sampled
#   mexico-city  discovered          -> skipped, pending geometry
#   monaco       discovered          -> skipped, pending geometry
#   singapore    discovered          -> skipped, pending geometry
#   suzuka       rejected            -> skipped, pending geometry
# `discovered` here means the compiled arc length is 1.3-1.8 % short of the
# official length, outside the declared 1 % tolerance; `rejected` means the
# OpenF1 elevation channel produced implausible grade spikes.
#
# Consequences, which the sampler reports rather than papers over:
#   - the `train` group samples monza and spa only, at their own
#     decision-opportunity weights, and records mexico-city as pending;
#   - the `calibration` group (monaco alone) CANNOT be sampled at all and
#     ScenarioSampler(group="calibration") refuses with the reason;
#   - the `heldout_circuits` final generalisation test cannot be run yet
#     either, because neither singapore nor suzuka loads.
# The groups are deliberately NOT rewritten to work around this: a split moved
# to fit today's packages is a new revision with a new hash, and reshuffling
# validated circuits between groups would leave one usable circuit per group.
# Recompile/revalidate the packages; the split then works as written.
#
# Group semantics:
#   train              circuits episodes are sampled from during training
#   calibration        separate circuits/sessions for tuning and thresholds
#   heldout_circuits   complete circuits withheld for the final track-generalisation test
#   heldout_conditions trained circuits that are run under condition combinations
#                      never sampled in training (wet + gusty, low energy)
#
# Six packages exist. The specification asks the final held-out set to contain
# one high-speed, one street and one elevation/weather circuit; with six
# packages this revision withholds one street circuit (singapore) and one
# high-speed/elevation circuit (suzuka) and records the shortfall. Revise the
# split (new revision, new hash) when more circuits are compiled.

id: circuit-split-v1
synthetic: true
status_note: >-
  Real circuit geometry (OpenF1 driven line, CC BY-NC-SA 4.0); car, battery and
  driver parameters are synthetic. Label: real_circuit_synthetic_energy.

groups:
  train: [monza, spa, mexico-city]
  calibration: [monaco]
  heldout_circuits: [singapore, suzuka]
  heldout_conditions: [monza, spa]

# The scenario document (configs/scenarios/<id>.yaml) that carries the car,
# driver, opponent and observation setup for each circuit. Circuits without a
# document cannot be turned into a bundle; the sampler says so instead of
# inventing one.
scenario_documents:
  monza: monza-real-battle
  spa: spa-real-battle
  mexico-city: mexico-city-real-battle
  monaco: monaco-real-battle

# Coherent condition regimes per circuit: whole tapes from configs/conditions,
# never shuffled fields. `training` tapes may be drawn by the train and
# calibration samplers; `heldout` tapes are reserved for the heldout_conditions
# group and are refused for any other group.
conditions:
  training:
    monza: [monza-2025-race]
    spa: [spa-2025-race]
    mexico-city: [mexico-city-2025-race]
    monaco: [monaco-2025-race]
  heldout:
    monza: [synthetic-wet-gusty]
    spa: [synthetic-wet-gusty]

# Balance by decision opportunities, not lap count. A circuit's weight is
# race_laps * length_m / decision_interval_m, i.e. the number of one-second
# policy decisions a race on that circuit offers, so 78 Monaco laps do not
# dominate 44 Spa laps. race_laps and official lengths come from the 2026
# registry (configs/tracks/registry/season_2026.json); the decision interval is
# the policy cadence times a declared synthetic reference pace.
balance:
  method: decision_opportunities
  decision_interval_m: 70.0
  decision_interval_provenance: >-
    1.0 s policy cadence x 70 m/s synthetic reference pace. Not a measured lap
    speed of any circuit.

# Own energy is sampled from a declared synthetic distribution. Public data
# cannot initialise a true 2026 battery charge, so every run built by the
# sampler carries this label and the Parameter source below.
energy:
  label: real_circuit_synthetic_energy
  source: "synthetic:real_circuit_synthetic_energy-v1"
  distribution: uniform
  low_j: 1200000.0
  high_j: 3600000.0
  unit: J
  note: >-
    Uniform over [1.2, 3.6] MJ inside the synthetic car's 0-4 MJ window. An
    engineering starting distribution; not a measurement.

# Seeds are drawn per episode from this range by the keyed stream.
seeds:
  low: 1
  high: 1000000
