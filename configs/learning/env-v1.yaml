# Learning environment revision — A07-owned.
#
# Every number here is an engineering starting setting frozen so a run manifest
# can name it. None of it is a measured optimum and none of it describes a real
# car, circuit or race. The scenarios are the synthetic fixtures shipped in
# configs/scenarios/.
#
# CHANGING ANY VALUE HERE CHANGES THE ENVIRONMENT REVISION. A replay buffer
# collected under one revision is not interchangeable with one collected under
# another: `environment_version` is written into every checkpoint and every
# bundle so a mismatch is visible rather than silent.

id: env-v1
synthetic: true
objective_id: objective-v1

# Policy cadence is exactly 1 s in training and serving v1.
policy_interval_s: 1.0
# Physics sub-step inside one policy tick. The simulator subdivides further at
# line crossings; this is the outer integration granularity.
physics_step_s: 0.05
# The fixed deployment preference window a[0] decodes over.
preference_window_s: 10.0
# The declared tactical checkpoint interval a[1] decodes a reserve target at.
checkpoint_interval_s: 10.0

# Hard cap on policy steps per episode. Reaching it is a TRUNCATION, not a
# terminal state: continuation value is real there and the potential is retained.
max_episode_steps: 60

# Planner integration.
#   full        the full planner including re-simulation of finalists
#   no_rollout  the same solve and the same independent check, without the
#               re-simulation stage (A06 measures ~86% of planner latency in
#               that stage; disabling it trades evidence for throughput and the
#               trade is recorded in the environment revision)
#   disabled    no planner; the environment refuses to run and says so
planner_mode: no_rollout
planner_deadline_s: 0.2

# The shipped rule pack resolves the overtake permission only at its detection
# line (s_m = 1600). Until it is crossed the independent checker returns
# `unknown` for every candidate and nothing is accepted. Each scenario below
# therefore declares the progress its episode starts from, reached under this
# conserving warm-up profile. The warm-up is part of the scenario starting
# state: identical for every controller, reported in the reset info, not scored,
# and not a learned decision.
warmup_profile: harvest
warmup_limit_s: 180.0
plan_validity_s: 3.0
# Re-solve when the decoded budget preference moves by more than this much,
# otherwise the eligible plan already in force is reused.
replan_energy_tolerance_j: 50000.0

# Provenance of the reference pace behind the shaping potential Phi. This is a
# fixed track pace model applied to observed progress. It is NOT future race
# truth and it is not a prediction of the actual finishing time.
reference_pace_provenance: >-
  Fixed per-scenario pace, taken as the scenario's declared initial speed. A
  synthetic engineering assumption; it is not measured and it is not a lap-time
  model of any real circuit.

scenarios:
  - id: two-straight-counterattack
    family: counterattack
    # Segment length the episode is scored over, in metres of ego progress.
    race_distance_m: 2400.0
    reference_pace_mps: 72.0
    rule_pack: synthetic-pack-v1
    seeds: [11, 29, 47, 71, 97]
    warmup_to_progress_m: 1650.0
  - id: oval-defend-hold
    family: defend
    race_distance_m: 2200.0
    reference_pace_mps: 68.0
    rule_pack: synthetic-pack-v1
    seeds: [11, 29, 47, 71, 97]
    warmup_to_progress_m: 1650.0
  - id: oval-low-energy
    family: low_energy
    race_distance_m: 2000.0
    reference_pace_mps: 65.0
    rule_pack: synthetic-pack-v1
    seeds: [11, 29, 47, 71, 97]
    warmup_to_progress_m: 1650.0
  - id: loop-no-energy-channel
    family: no_energy_channel
    race_distance_m: 2200.0
    reference_pace_mps: 70.0
    rule_pack: synthetic-pack-v1
    seeds: [11, 29, 47, 71, 97]
    warmup_to_progress_m: 1950.0
