id: synthetic-wet-gusty
description: >
  Synthetic wet case: cool humid air, rainfall flag set for the whole window,
  a 9 m/s wind blowing from the east (90 deg) with the keyed gust model enabled
  (sigma 3 m/s). A synthetic sketch track has no absolute yaw, so the engine's
  relative heading of zero at the start straight is treated as east; a wind
  from the east is therefore a headwind there, which is what the engine test
  needs to show wetness and wind reaching the car in the physical direction.
  Nothing here is a measurement.
source: synthetic
synthetic:
  air_temperature_k: 287.15
  track_temperature_k: 291.15
  pressure_pa: 100800.0
  humidity_fraction: 0.95
  wind_speed_mps: 9.0
  wind_direction_deg: 90.0
  rainfall: true
  duration_s: 3600.0
  sample_interval_s: 60.0
gust:
  enabled: true
  sigma_mps: 3.0
  bin_width_s: 2.0
rubber_fraction: 0.0
notes:
  - "synthetic; wet floor and gust sigma are synthetic assumptions (see conditions/grip.py, tape.py)"
