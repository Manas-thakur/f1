# AFTERLAP synthetic rule pack v2 (strict)
#
# SYNTHETIC AND UNREVIEWED, exactly like v1. This pack exists to exercise
# ruleset-hash change handling: it differs from v1 in the speed-dependent curve
# and in the per-lap recharge allowance, so a plan checked against v1 must be
# re-evaluated rather than carried over.

id: synthetic-pack-v2-strict
synthetic: true
reviewed: false
description: >-
  Illustrative synthetic rule pack with a lower speed curve and a lower per-lap
  recharge allowance than synthetic-pack-v1. Used to test that a ruleset change
  invalidates an outstanding plan.
season_revision: synthetic-2026-r1

season:
  id: synthetic-season-2026-r1

  statements:
    absolute_power_ceiling_w:
      value: 350000.0
      unit: W
      measurement_bus: ers_k_dc
      representation: "deployment_power_w(ers_k_dc) <= 350000"
      article: C5.2.7
      source_id: R02
      source_url: https://www.fia.com/regulation/category/2182
      published_date: "2026-08-05"
      effective_date: "2026-08-05"
      reviewer: null

    battery_energy_min_j:
      value: 0.0
      unit: J
      measurement_bus: battery
      representation: "battery_energy_j >= 0"
      article: C5.2.9
      source_id: R02
      published_date: "2026-08-05"
      effective_date: "2026-08-05"
      reviewer: null

    battery_energy_max_j:
      value: 4000000.0
      unit: J
      measurement_bus: battery
      representation: "battery_energy_j <= 4000000"
      article: C5.2.9
      source_id: R02
      published_date: "2026-08-05"
      effective_date: "2026-08-05"
      reviewer: null

    recharge_allowance_per_lap_j:
      value: 5000000.0
      unit: J
      measurement_bus: cu_k_dc
      representation: "cumulative_charge_bus_energy_j(this_lap) <= 5000000"
      article: C5.2.10
      source_id: R02
      published_date: "2026-08-05"
      effective_date: "2026-08-05"
      reviewer: null
      note: Lower than v1's 8.5 MJ; still measured on the CU-K DC bus.

    recharge_measurement_bus:
      text_value: cu_k_dc
      representation: "recharge ledger is accumulated at the CU-K DC bus"
      article: C5.2.10
      source_id: R02
      reviewer: null

    max_power_ramp_w_per_s:
      value: 700000.0
      unit: W/s
      measurement_bus: ers_k_dc
      representation: "abs(d(deployment_power_w)/dt) <= 700000"
      article: C5.12
      source_id: R02
      published_date: "2026-08-05"
      effective_date: "2026-08-05"
      reviewer: null

    overtake_profile_extra_power_w:
      value: 0.0
      unit: W
      measurement_bus: ers_k_dc
      representation: "overtake profile grants permission, not extra ceiling"
      article: B7.2
      source_id: R03
      reviewer: null

  power_curves:
    - curve_id: baseline-speed-curve
      measurement_bus: ers_k_dc
      points:
        - {speed_mps: 0.0, max_power_w: 250000.0}
        - {speed_mps: 60.0, max_power_w: 250000.0}
        - {speed_mps: 95.0, max_power_w: 100000.0}
        - {speed_mps: 110.0, max_power_w: 0.0}
      statement:
        representation: "piecewise-linear ceiling in speed, stricter than the v1 curve"
        article: C5.2.8
        source_id: R02
        published_date: "2026-08-05"
        effective_date: "2026-08-05"
        reviewer: null
        unit: W
        measurement_bus: ers_k_dc

  thermal_derate:
    onset_k: 353.15
    full_derate_k: 373.15
    min_factor: 0.6
    statement:
      representation: "derate factor falls linearly from 1.0 at 353.15 K to 0.6 at 373.15 K"
      article: synthetic-thermal-derate
      source_id: SYNTHETIC
      reviewer: null
      unit: dimensionless
      measurement_bus: ers_k_dc

  coverage:
    - concern: Electrical DC ceiling
      status: implemented_and_tested
      reference_keys: [absolute_power_ceiling_w]
      test_ids:
        - test_pack_change.py::test_plan_legal_under_v1_is_reevaluated_under_v2
    - concern: Speed/context curves
      status: implemented_and_tested
      test_ids:
        - test_pack_change.py::test_pack_change_changes_ruleset_hash
        - test_pack_change.py::test_plan_legal_under_v1_is_reevaluated_under_v2
    - concern: Charge range
      status: implemented_and_tested
      reference_keys: [battery_energy_min_j, battery_energy_max_j]
      test_ids:
        - test_pack_change.py::test_plan_legal_under_v1_is_reevaluated_under_v2
    - concern: Recharge allowance
      status: implemented_and_tested
      reference_keys: [recharge_allowance_per_lap_j, recharge_measurement_bus]
      test_ids:
        - test_pack_change.py::test_lower_allowance_in_v2_changes_the_recharge_margin
    - concern: Power demand transitions
      status: implemented_and_tested
      reference_keys: [max_power_ramp_w_per_s]
      test_ids:
        - test_checker.py::test_impossible_ramp_is_rejected
    - concern: Overtake permission
      status: review_required
      note: >-
        This pack declares no detection or activation line. Overtake permission
        cannot be resolved from it and no zone geometry exists.
    - concern: Flags and conditions
      status: implemented_and_tested
      test_ids:
        - test_pack_change.py::test_checker_reports_the_new_hash_after_a_pack_update
    - concern: Driver information path
      status: not_applicable
      note: Owned by the API and simulation modules.
    - concern: Unknown referenced documents
      status: implemented_and_tested
      test_ids:
        - test_unknown.py::test_aggregate_is_unknown_when_any_check_is_unknown
    - concern: Thermal and torque derating
      status: review_required
      note: Invented engineering curve with no resolved regulatory source.
    - concern: Event-specific curves, allowances and line locations
      status: unsupported
      note: This pack carries no event level at all.
    - concern: Execution lead time
      status: implemented_and_tested
      test_ids:
        - test_checker.py::test_insufficient_execution_lead_time_fails
      note: Operational constraint of this product, not an FIA article.

  unknown_conditions:
    - condition: event_supporting_document_referenced_but_not_resolved
      critical: false
      scope: advisory
      note: >-
        Recorded so that a passing check is never read as evidence that every
        applicable condition was resolved.

race_control:
  - at_session_time_s: 0.0
    label: session-start-green
    flags: [green]
