# AFTERLAP planner revision planner-v1.
#
# SYNTHETIC. Every number here is an engineering assumption chosen so the
# planner is executable and testable. None of it is a measurement, a calibrated
# optimum, or evidence of performance.
#
# This document tunes the *planner*: horizons, bounded candidate/scenario
# counts, the smooth surrogate used inside the continuous solver, and the
# execution-timing model. It deliberately contains **none** of the objective
# trade-off coefficients: those live in configs/objectives/objective-v1.yaml,
# which is frozen and coordinator-owned, and are loaded from there.

id: planner-v1
synthetic: true
description: >-
  Initial commissioning planner settings. Horizons and budgets are chosen to fit
  a 200 ms decision deadline on the hardware named in the A06 handoff; the
  surrogate coefficients are reduced-model assumptions, not fitted values.

horizon:
  # The detailed horizon ends at the first named checkpoint beyond the corridor,
  # capped by this duration. Beyond it the analytic continuation term applies.
  detailed_horizon_s:
    value: 9.0
    unit: s
    source: planning/OPTIMIZATION.md "Horizons"
    verification: synthetic_assumption
    lower_bound: 1.0
    note: >-
      Long enough to contain a battle and the likely counterattack on the
      synthetic loop; short enough that the shared near-term control assumption
      is not stretched past a replan.
  min_segment_length_m:
    value: 60.0
    unit: m
    source: planning/TECHNICAL_SPEC.md driver-executable instructions
    verification: synthetic_assumption
    lower_bound: 1.0
    note: A segment shorter than this is not a separable human instruction.
  max_segments: 5
  continuation_distance_scale_m:
    value: 20000.0
    unit: m
    source: planning/OPTIMIZATION.md "avoid a fixed arbitrary reserve"
    verification: synthetic_assumption
    lower_bound: 1.0
    note: >-
      Remaining race distance over which stored energy retains its full marginal
      value. Below it the continuation value tapers linearly to exactly zero at
      the true finish, so unused energy is never rewarded at the flag.

budgets:
  max_candidates: 5
  max_scenarios: 6
  rollout_finalists: 2
  rollout_scenarios: 3
  rollout_step_s:
    value: 0.5
    unit: s
    source: planning/TECHNICAL_SPEC.md bounded candidate/scenario count
    verification: synthetic_assumption
    lower_bound: 0.01
    note: >-
      Re-simulation step. Coarser than the simulator's validation step; the
      resolution is recorded with every decision and must not be presented as
      the same confidence as a finer one.
  rollout_horizon_s:
    value: 10.5
    unit: s
    source: planning/TECHNICAL_SPEC.md planner latency target
    verification: synthetic_assumption
    lower_bound: 0.5
  estimate_max_age_s:
    value: 1.5
    unit: s
    source: contracts/UNITS_TIME.md freshness at selection and execution
    verification: synthetic_assumption
    lower_bound: 0.0

execution:
  driver_reaction_time_s:
    value: 0.6
    unit: s
    source: simulation driver execution model; matches CheckerState default
    verification: synthetic_assumption
    lower_bound: 0.0
  instruction_lead_time_s:
    value: 1.0
    unit: s
    source: planning/TECHNICAL_SPEC.md execution time window
    verification: synthetic_assumption
    lower_bound: 0.0
    note: Time between publishing an instruction and the segment it starts.
  instruction_execution_window_s:
    value: 1.5
    unit: s
    source: planning/TECHNICAL_SPEC.md instruction duration
    verification: synthetic_assumption
    lower_bound: 0.01
    note: >-
      Window the driver has to begin a segment. It is also the denominator of
      the checker's power-ramp test, so it is never reported longer than the
      segment it belongs to.
  recommendation_validity_s:
    value: 8.0
    unit: s
    source: contracts/UNITS_TIME.md decision expiry
    verification: synthetic_assumption
    lower_bound: 0.1

surrogate:
  # Smooth continuous model used *inside* the solver only. Candidate plans are
  # always re-simulated with the full physics afterwards and independently
  # rechecked; a disagreement between the two is expected and is recorded, not
  # hidden.
  air_density_kgpm3:
    value: 1.2
    unit: kg/m^3
    source: synthetic:afterlap-car-sketch-v1
    verification: synthetic_assumption
    lower_bound: 0.1
  drag_area_m2:
    value: 1.0
    unit: m^2
    source: synthetic:afterlap-car-sketch-v1
    verification: synthetic_assumption
    lower_bound: 0.05
    note: CdA. With the density above this gives the cubic-drag constant 0.6 kg/m.
  drivetrain_efficiency:
    value: 0.95
    unit: "1"
    source: synthetic:afterlap-car-sketch-v1
    verification: synthetic_assumption
    lower_bound: 0.1
    upper_bound: 1.0
  charge_efficiency:
    value: 0.9
    unit: "1"
    source: synthetic:afterlap-car-sketch-v1
    verification: synthetic_assumption
    lower_bound: 0.1
    upper_bound: 1.0
    note: >-
      Battery energy gain divided by CU-K DC bus energy. The checker converts
      with the same number; the two ledgers are never compared directly.
  harvest_opportunity_coefficient:
    value: 0.35
    unit: "1"
    source: planning/OPTIMIZATION.md reduced-model assumption
    verification: synthetic_assumption
    lower_bound: 0.0
    upper_bound: 1.0
    note: >-
      Fraction of harvested mechanical energy that would otherwise have
      propelled the car. Zero would mean all harvest is free braking energy;
      one would mean none of it is. This is an unvalidated modelling choice and
      it is the single largest source of surrogate/simulator disagreement.
  regen_availability:
    value: 0.30
    unit: "1"
    source: planning/OPTIMIZATION.md reduced-model assumption
    verification: synthetic_assumption
    lower_bound: 0.0
    upper_bound: 1.0
    note: Fraction of a segment during which regenerative braking is available.
  max_harvest_power_w:
    value: 350000.0
    unit: W
    source: synthetic:afterlap-car-sketch-v1
    verification: synthetic_assumption
    lower_bound: 0.0
  min_speed_mps:
    value: 20.0
    unit: m/s
    source: planning/OPTIMIZATION.md feasible corridor
    verification: synthetic_assumption
    lower_bound: 1.0
    note: Floor the surrogate speed may not be driven below by harvesting.
  gap_logistic_scale_s:
    value: 0.35
    unit: s
    source: planning/OPTIMIZATION.md smooth position outcome
    verification: synthetic_assumption
    lower_bound: 0.01
    note: >-
      Width of the smooth position transition. It is a differentiability device
      for the solver, not a calibrated pass probability; the reported
      probabilities come from weighted scenario rollouts instead.
  position_persistence:
    value: 0.5
    unit: "1"
    source: planning/OPTIMIZATION.md truncated-horizon accounting
    verification: synthetic_assumption
    lower_bound: 0.0
    upper_bound: 1.0
    note: >-
      Share of the finish-position penalty attributed to a position held at the
      end of the detailed horizon. Unvalidated; it prevents an intermediate
      position from being priced as a finish position.
  counterattack_rate_s_per_j:
    value: 1.4e-6
    unit: s/J
    source: planning/OPTIMIZATION.md counterattack modelling
    verification: synthetic_assumption
    lower_bound: 0.0
    note: >-
      Seconds a rival recovers per joule by which its reserve exceeds ours at the
      end of the detailed horizon. This is what makes a greedy pass that empties
      the battery lose the position again inside the modelled horizon.
  counterattack_energy_scale_j:
    value: 150000.0
    unit: J
    source: planning/OPTIMIZATION.md smooth counterattack response
    verification: synthetic_assumption
    lower_bound: 1.0
    note: Softness of the reserve-deficit transition; a smoothing scale, not a threshold.

scenarios:
  # Deterministic quadrature over the rival belief. When the rival's stored
  # energy is unobserved the nodes span the declared physical window instead of
  # collapsing to a point, so the ensemble visibly widens.
  energy_quantiles: [0.15, 0.5, 0.85]
  energy_quantile_weights: [0.25, 0.5, 0.25]
  unknown_energy_widening: 1.0
  max_intentions: 2
  interval_coverage_widening:
    value: 1.32
    unit: "1"
    source: >-
      handoffs/A05.md section 5 - rival energy 90 % quantile interval, measured
      empirical coverage 0.7885 on 156 records across 12 scenarios
    verification: calibrated_on_synthetic
    lower_bound: 1.0
    note: >-
      Multiplier applied to the half-width of a rival-energy quantile interval
      before it is used as scenario support. A05 labels that interval 90 % but
      measures 0.7885 coverage; under a Gaussian re-scaling the half-width has
      to grow by z(0.95)/z(0.89425) = 1.6449/1.2485 = 1.317 for the nominal label
      to hold. A05 also records that the shortfall is bias rather than spread, so
      this widening is a conservative margin and NOT a correction: the disclosed
      coverage of the underlying belief stays 0.7885 and must be reported as
      such (planning/OPTIMIZATION.md, "use conservative margins based on
      calibration and disclose the scenario model's coverage").
  intention_pace_gain_s:
    conserve:
      value: -0.10
      unit: s
      source: estimation rival mode sketch
      verification: synthetic_assumption
    normal:
      value: 0.0
      unit: s
      source: estimation rival mode sketch
      verification: synthetic_assumption
    attack:
      value: 0.18
      unit: s
      source: estimation rival mode sketch
      verification: synthetic_assumption
    defend:
      value: 0.08
      unit: s
      source: estimation rival mode sketch
      verification: synthetic_assumption

solver:
  max_iterations: 200
  tolerance: 1.0e-8
  print_level: 0
