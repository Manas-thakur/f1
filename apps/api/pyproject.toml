[project]
name = "afterlap-api"
version = "0.1.0"
description = "Standalone race simulator"
requires-python = "==3.12.*"
dependencies = ["afterlap-core", "psycopg[binary]>=3.2,<4", "websockets>=15,<18"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "afterlap_api"
module-root = ""

[tool.uv.sources]
afterlap-core = { workspace = true }
