[project]
name = "afterlap-api"
version = "0.1.0"
description = "AFTERLAP Python CLI and session runtime"
requires-python = "==3.12.*"
dependencies = [
    "afterlap-application",
    "afterlap-contracts",
    "afterlap-core",
    "afterlap-infrastructure",
    "anyio>=4.0",
    "numpy>=2.0,<3",
    "typer>=0.12",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
]

[project.scripts]
afterlap-api = "afterlap_api.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "afterlap_api"
module-root = ""

[tool.uv.sources]
afterlap-application = { workspace = true }
afterlap-contracts = { workspace = true }
afterlap-core = { workspace = true }
afterlap-infrastructure = { workspace = true }
