[project]
name = "afterlap-api"
version = "0.1.0"
description = "AFTERLAP Python control-plane CLI and session runtime"
requires-python = "==3.12.*"
dependencies = [
    "afterlap-contracts",
    "afterlap-core",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "websockets>=13.0",
    "prometheus-client>=0.21",
    "typer>=0.12",
]

[project.scripts]
afterlap-api = "afterlap_api.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afterlap_api"]

[tool.uv.sources]
afterlap-contracts = { workspace = true }
afterlap-core = { workspace = true }
