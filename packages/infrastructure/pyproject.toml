[project]
name = "afterlap-infrastructure"
version = "0.1.0"
description = "AFTERLAP persistence and operational adapters"
requires-python = "==3.12.*"
dependencies = [
    "afterlap-contracts",
    "afterlap-core",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "afterlap_infrastructure"
module-root = ""

[tool.uv.sources]
afterlap-contracts = { workspace = true }
afterlap-core = { workspace = true }
