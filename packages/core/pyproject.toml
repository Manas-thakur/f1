[project]
name = "afterlap-core"
version = "0.1.0"
description = "Standalone race simulator"
requires-python = "==3.12.*"
dependencies = ["afterlap-contracts", "gymnasium>=1,<2", "numpy>=2,<3", "pyyaml>=6", "pydantic>=2.9,<3"]

[project.optional-dependencies]
learning = ["stable-baselines3>=2.4,<3", "torch>=2.4,<3"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "afterlap_core"
module-root = ""

[tool.uv.sources]
afterlap-contracts = { workspace = true }
