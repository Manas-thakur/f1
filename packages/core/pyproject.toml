[project]
name = "afterlap-core"
version = "0.1.0"
description = "AFTERLAP domain core: data, simulation, rules, estimation, planning, learning, evaluation"
requires-python = "==3.12.*"
dependencies = [
    "afterlap-contracts",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pypdf>=5.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afterlap_core"]

[tool.uv.sources]
afterlap-contracts = { workspace = true }
