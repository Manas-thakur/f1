[project]
name = "afterlap-contracts"
version = "0.1.0"
description = "AFTERLAP authoritative wire contracts (contract revision 1)"
requires-python = "==3.12.*"
dependencies = ["pydantic>=2.9,<3", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afterlap_contracts"]
