# Same-origin routing for the AFTERLAP product.
#
# nginx serves the built React assets and proxies /api and /ws to the API
# container. Both prefixes are on this origin, so the bundle contains no API
# host and no CORS configuration exists to get wrong.
#
# The session stream is /api/v1/sessions/{id}/stream — a WebSocket *under*
# /api. The dev proxy got this wrong once (coordinator decision D-07 defect 3:
# `ws: true` was set only on the unused /ws rule, the socket never upgraded and
# every command control stayed disabled). The upgrade headers below are
# therefore set on the /api location, not only on /ws.

upstream afterlap_api {
    server api:8000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Unprivileged port: the container runs as uid 101 and the host-side
    # publish in docker-compose.yml binds 127.0.0.1 only.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Operational surfaces are not public documents.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 8m;

    # nginx's own liveness, distinct from the API's readiness. It says nothing
    # about whether a decision can be made.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "nginx serving static assets\n";
    }

    location /api/ {
        proxy_pass         http://afterlap_api;
        proxy_http_version 1.1;

        # WebSocket upgrade for /api/v1/sessions/{id}/stream.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A session stream is long-lived and mostly idle between decisions;
        # the API sends a heartbeat every 10 s (HEARTBEAT_INTERVAL_S), so a
        # read timeout comfortably above that keeps it open without hiding a
        # genuinely dead upstream.
        proxy_read_timeout    75s;
        proxy_send_timeout    75s;
        proxy_connect_timeout 5s;

        # Streamed events must not be held back by a proxy buffer.
        proxy_buffering off;
    }

    # Reserved by decisions.md and currently unused by the application. Kept
    # so a future move of the stream to /ws needs no image change.
    location /ws {
        proxy_pass         http://afterlap_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_read_timeout 75s;
        proxy_buffering    off;
    }

    location = /metrics {
        proxy_pass       http://afterlap_api;
        proxy_set_header Host $host;
    }

    # Hashed build assets are immutable; the entry document is not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Client-side routes deep-link, so an unknown path falls back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
